<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::section}, 'Detalii Produs')}">
<body>
<section>

    <div class="glass-card p-4">
        <div class="row g-4">
            <div class="col-5">
                <div class="product-img-wrapper">
                    <img th:src="${product.imageUrl}" class="product-img">
                    <span class="product-badge" th:text="${product.category.name}">Categorie</span>
                </div>
            </div>

            <div class="col-7">
                <p class="text-warning" th:text="${product.brand}">Brand</p>
                <h2 th:text="${product.name}">Denumire instrument</h2>
                <p class="text-muted" th:text="${product.description}">Descriere...</p>

                <p class="price-tag" th:text="${product.price} + ' RON'">0 RON</p>
                <p class="text-muted" th:text="'În stoc: ' + ${product.stockQuantity} + ' buc.'">În stoc: 0</p>

                <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                    <button type="submit" class="btn btn-gold" th:disabled="${product.stockQuantity == 0}">Adaugă în Coș</button>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
