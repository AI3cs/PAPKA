<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sonora Guitars - Conectare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-5">

                <div th:if="${param.error}" class="alert alert-danger mb-4">
                    Credențiale invalide! Verificați numele de utilizator și parola.
                </div>
                <div th:if="${param.success}" class="alert alert-success mb-4">
                    Contul a fost creat cu succes! Vă puteți conecta acum.
                </div>
                <div th:if="${param.logout}" class="alert alert-info mb-4">
                    V-ați deconectat cu succes din magazin.
                </div>

                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-guitar fa-3x text-warning mb-3"></i>
                        <h2>SONORA GUITARS</h2>
                        <p class="text-muted">Conectare în magazin</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nume de utilizator</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Parolă</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-gold w-100">CONECTEAZĂ-TE</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Nu aveți cont?
                            <a th:href="@{/register}">Înregistrați-vă acum</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
