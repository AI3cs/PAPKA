<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::section}, 'Formular Produs')}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-8">

            <div class="glass-card p-5">
                <h2 class="mb-4"><i class="fa-solid fa-guitar text-warning me-2"></i>Formular Instrument</h2>

                <form th:action="@{/products/add}" method="post">

                    <input type="hidden" name="id" th:value="${product.id}">

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Denumire Instrument</label>
                            <input type="text" name="name" th:value="${product.name}" class="form-control" required>
                        </div>

                        <div class="col-6">
                            <label class="form-label">Brand / Producător</label>
                            <input type="text" name="brand" th:value="${product.brand}" class="form-control" required>
                        </div>

                        <div class="col-4">
                            <label class="form-label">Preț (RON)</label>
                            <input type="number" step="0.01" name="price" th:value="${product.price}" class="form-control" required>
                        </div>

                        <div class="col-4">
                            <label class="form-label">Cantitate în Stoc</label>
                            <input type="number" name="stockQuantity" th:value="${product.stockQuantity}" class="form-control" required>
                        </div>

                        <div class="col-4">
                            <label class="form-label">Categorie</label>
                            <select name="category" class="form-select" required>
                                <option value="">Alege categoria...</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">URL Imagine Instrument (Opțional)</label>
                            <input type="text" name="imageUrl" th:value="${product.imageUrl}" class="form-control">
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Descriere</label>
                            <textarea name="description" th:text="${product.description}" class="form-control" rows="4"></textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-3">
                        <button type="submit" class="btn btn-gold">Salvează Datele</button>
                        <a th:href="@{/products}" class="btn btn-outline-gold">Anulează</a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</section>
</body>
</html>
